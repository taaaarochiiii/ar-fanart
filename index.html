<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      touch-action: manipulation;
    }

    video:not(.ar-asset-video) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background: transparent !important;
      z-index: 0 !important;
    }

    a-scene {
      position: fixed;
      inset: 0;
      background: transparent !important;
      z-index: 1;
    }

    a-scene canvas,
    .a-canvas {
      background: transparent !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-enter-vr-modal {
      display: none !important;
    }

    .photo-controls {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(22px + env(safe-area-inset-bottom));
      z-index: 20;
      pointer-events: none;
    }

    .capture-button {
      position: relative;
      width: 72px;
      height: 72px;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.88);
      border-radius: 50%;
      background: #ffffff;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.38),
        inset 0 0 0 5px rgba(255, 255, 255, 0.72),
        inset 0 0 0 9px rgba(5, 7, 10, 0.16);
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .capture-button:active {
      transform: scale(0.94);
    }

    .capture-button[disabled] {
      cursor: wait;
      opacity: 0.62;
    }

    @media (max-width: 520px) {
      .photo-controls {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
  <script>
    AFRAME.registerShader("chromakey", {
      schema: {
        src: { type: "map", is: "uniform" },
        keyColor: { type: "color", default: "#00ff00", is: "uniform" },
        similarity: { type: "number", default: 0.35, is: "uniform" },
        smoothness: { type: "number", default: 0.08, is: "uniform" },
        spill: { type: "number", default: 0.2, is: "uniform" }
      },
      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D src;
        uniform vec3 keyColor;
        uniform float similarity;
        uniform float smoothness;
        uniform float spill;
        varying vec2 vUv;

        void main() {
          vec4 videoColor = texture2D(src, vUv);
          float diff = distance(videoColor.rgb, keyColor);
          float alpha = smoothstep(similarity, similarity + smoothness, diff);
          float greenSpill = max(0.0, videoColor.g - max(videoColor.r, videoColor.b));
          float spillMask = smoothstep(0.0, 0.32, greenSpill);
          float despill = spill * spillMask;
          vec3 color = videoColor.rgb;

          color.g = mix(color.g, max(color.r, color.b) * 0.92, despill);
          color.r += greenSpill * despill * 0.10;
          color.b += greenSpill * despill * 0.06;
          gl_FragColor = vec4(color, videoColor.a * alpha);

          if (gl_FragColor.a < 0.01) {
            discard;
          }
        }
      `
    });
  </script>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; smoothing: true; warmupTolerance: 5; missTolerance: 5; filterMinCF:0.0001; filterBeta: 0.001"
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true"
  >
    <a-assets>
      <video id="riona-video" class="ar-asset-video" src="images/2_%E3%83%AA%E3%82%AA%E3%83%8A.mp4" loop muted playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
      <img id="layer-confetti" src="images/3_%E7%B4%99%E5%90%B9%E9%9B%AA.png" crossorigin="anonymous">
      <img id="layer-text-1-shadow" src="images/4_%E6%96%87%E5%AD%97_1_s.png" crossorigin="anonymous">
      <img id="layer-text-1" src="images/5_%E6%96%87%E5%AD%97_1.png" crossorigin="anonymous">
      <img id="layer-text-2-shadow" src="images/6_%E6%96%87%E5%AD%97_2_s.png" crossorigin="anonymous">
      <img id="layer-text-2" src="images/7_%E6%96%87%E5%AD%97_2.png" crossorigin="anonymous">
    </a-assets>

    <a-entity light="type: ambient; intensity: 1"></a-entity>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity position="0 0 0" scale="1 1 1">
        <a-plane
          width="1.412"
          height="1"
          position="0 0 0.20"
          material="shader: chromakey; src: #riona-video; keyColor: #00ff00; similarity: 0.38; smoothness: 0.10; spill: 0.85; transparent: true; depthWrite: false; side: double"
          animation__float="property: position; from: 0 -0.030 0.20; to: 0 0.035 0.20; dir: alternate; dur: 1900; easing: easeInOutSine; loop: true"
        ></a-plane>

        <a-plane
          src="#layer-confetti"
          width="1.412"
          height="1"
          position="0 0.02 0.28"
          material="shader: flat; transparent: true; depthWrite: false; side: double; opacity: 0.35"
          animation__blink="property: material.opacity; from: 0.18; to: 1; dir: alternate; dur: 1800; easing: easeInOutSine; loop: true"
        ></a-plane>

        <a-plane
          src="#layer-text-1-shadow"
          width="1.12"
          height="0.84"
          position="0 0.06 0.32"
          material="shader: flat; transparent: true; depthWrite: false; side: double; opacity: 0.45"
          animation__sway="property: rotation; dir: alternate; dur: 1500; easing: easeInOutSine; loop: true; to: 0 0 6"
        ></a-plane>

        <a-plane
          src="#layer-text-1"
          width="1.12"
          height="0.84"
          position="0 0.06 0.34"
          material="shader: flat; transparent: true; depthWrite: false; side: double"
          animation__sway="property: rotation; dir: alternate; dur: 1500; easing: easeInOutSine; loop: true; to: 0 0 8"
        ></a-plane>

        <a-plane
          src="#layer-text-2-shadow"
          width="1.22"
          height="0.915"
          position="0 0.06 0.38"
          material="shader: flat; transparent: true; depthWrite: false; side: double; opacity: 0.45"
          animation__sway="property: rotation; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 0 0 -8"
        ></a-plane>

        <a-plane
          src="#layer-text-2"
          width="1.22"
          height="0.915"
          position="0 0.06 0.40"
          material="shader: flat; transparent: true; depthWrite: false; side: double"
          animation__sway="property: rotation; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 0 0 -11"
        ></a-plane>
      </a-entity>
    </a-entity>

    <a-camera active="true" position="0 0 0" look-controls="enabled: false"></a-camera>
  </a-scene>

  <div class="photo-controls">
    <button id="capture-button" class="capture-button" type="button" aria-label="Capture photo" title="Capture photo"></button>
  </div>

  <script>
    const sceneEl = document.querySelector("a-scene");
    const rionaTarget = document.getElementById("target0");
    const rionaVideo = document.getElementById("riona-video");
    let rionaVideoActive = false;

    keepCameraFeedVisible();
    removeVrUi();
    sceneEl?.addEventListener("loaded", ensureTransparentRenderer);
    sceneEl?.addEventListener("renderstart", ensureTransparentRenderer);
    sceneEl?.addEventListener("arReady", keepCameraFeedVisible);
    new MutationObserver(keepCameraFeedVisibleOnce).observe(document.body, {
      childList: true,
      subtree: true
    });

    setupPhotoCapture();
    setupRionaVideo();

    function setupRionaVideo() {
      if (!rionaTarget || !rionaVideo) {
        return;
      }

      rionaTarget.addEventListener("targetFound", () => {
        rionaVideoActive = true;
        playVideo(rionaVideo);
      });

      rionaTarget.addEventListener("targetLost", () => {
        rionaVideoActive = false;
        rionaVideo.pause();
      });

      document.body.addEventListener("click", unlockArVideos, { once: true });
      document.body.addEventListener("touchstart", unlockArVideos, { once: true });
    }

    function unlockArVideos() {
      playVideo(rionaVideo).then(() => {
        if (!rionaVideoActive) {
          rionaVideo.pause();
        }
      });
    }

    function playVideo(video) {
      if (!video) {
        return Promise.resolve();
      }

      video.muted = true;
      return video.play().catch(() => {});
    }

    function removeVrUi(attempt = 0) {
      document.querySelectorAll(".a-enter-vr, .a-enter-ar, .a-enter-vr-modal").forEach((element) => {
        element.remove();
      });

      if (attempt < 6) {
        window.setTimeout(() => removeVrUi(attempt + 1), 300);
      }
    }

    function setupPhotoCapture() {
      const captureButton = document.getElementById("capture-button");

      if (!captureButton) {
        return;
      }

      captureButton.addEventListener("click", async () => {
        captureButton.disabled = true;

        try {
          const blob = captureArPhoto();
          const fileName = createPhotoFileName();
          const file = new File([blob], fileName, { type: "image/png" });

          await sharePhotoFile(file, fileName);
        } catch (error) {
          if (error.name !== "AbortError") {
            console.error("Failed to capture AR photo.", error);
          }
        } finally {
          captureButton.disabled = false;
        }
      });
    }

    function captureArPhoto() {
      const video = findCameraVideo();
      const arCanvas = findArCanvas();

      if (!video || !video.videoWidth || !video.videoHeight) {
        throw new Error("Camera video is not ready yet.");
      }

      if (!arCanvas) {
        throw new Error("AR canvas is not ready yet.");
      }

      renderCurrentFrame();

      const outputSize = getCaptureSize(arCanvas);
      const outputCanvas = document.createElement("canvas");
      outputCanvas.width = outputSize.width;
      outputCanvas.height = outputSize.height;

      const context = outputCanvas.getContext("2d", {
        alpha: false,
        desynchronized: true
      });

      if (!context) {
        throw new Error("Failed to prepare photo canvas.");
      }

      context.fillStyle = "#05070a";
      context.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
      drawCover(context, video, outputCanvas.width, outputCanvas.height);
      context.drawImage(arCanvas, 0, 0, outputCanvas.width, outputCanvas.height);

      return canvasToPngBlob(outputCanvas);
    }

    async function sharePhotoFile(file, fileName) {
      const sharePayload = {
        files: [file],
        title: "Riona Birthday AR",
        text: "Captured with Riona Birthday AR."
      };

      if (navigator.canShare?.({ files: [file] }) && navigator.share) {
        await navigator.share(sharePayload);
        return "shared";
      }

      downloadBlob(file, fileName);
      return "downloaded";
    }

    function findCameraVideo() {
      const videos = Array.from(document.querySelectorAll("video"));
      return (
        videos.find(isUsableCameraVideo) ||
        videos.find((video) => !isArAssetVideo(video) && video.videoWidth && video.videoHeight) ||
        null
      );
    }

    function isUsableCameraVideo(video) {
      return (
        !isArAssetVideo(video) &&
        video.readyState >= 2 &&
        video.videoWidth &&
        video.videoHeight
      );
    }

    function isArAssetVideo(video) {
      return (
        video.classList.contains("ar-asset-video") ||
        Boolean(video.closest("a-assets"))
      );
    }

    function findArCanvas() {
      return sceneEl?.renderer?.domElement || sceneEl?.canvas || document.querySelector("canvas");
    }

    function renderCurrentFrame() {
      if (!sceneEl?.renderer || !sceneEl?.object3D || !sceneEl?.camera) {
        return;
      }

      sceneEl.renderer.preserveDrawingBuffer = true;
      sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
    }

    function getCaptureSize(arCanvas) {
      const rect = arCanvas.getBoundingClientRect();
      const cssWidth = Math.max(1, Math.round(rect.width || window.innerWidth || 720));
      const cssHeight = Math.max(1, Math.round(rect.height || window.innerHeight || 1280));
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      const maxSide = 2200;
      const rawWidth = Math.round(cssWidth * pixelRatio);
      const rawHeight = Math.round(cssHeight * pixelRatio);
      const scale = Math.min(1, maxSide / Math.max(rawWidth, rawHeight));

      return {
        width: Math.max(1, Math.round(rawWidth * scale)),
        height: Math.max(1, Math.round(rawHeight * scale))
      };
    }

    function drawCover(context, source, outputWidth, outputHeight) {
      const sourceWidth = source.videoWidth || source.width;
      const sourceHeight = source.videoHeight || source.height;
      const sourceRatio = sourceWidth / sourceHeight;
      const outputRatio = outputWidth / outputHeight;
      let cropX = 0;
      let cropY = 0;
      let cropWidth = sourceWidth;
      let cropHeight = sourceHeight;

      if (sourceRatio > outputRatio) {
        cropWidth = sourceHeight * outputRatio;
        cropX = (sourceWidth - cropWidth) / 2;
      } else {
        cropHeight = sourceWidth / outputRatio;
        cropY = (sourceHeight - cropHeight) / 2;
      }

      context.drawImage(
        source,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        outputWidth,
        outputHeight
      );
    }

    function canvasToPngBlob(canvas) {
      return dataUrlToBlob(canvas.toDataURL("image/png"));
    }

    function dataUrlToBlob(dataUrl) {
      const [header, base64] = dataUrl.split(",");
      const mimeMatch = header.match(/data:(.*?);base64/);
      const mime = mimeMatch?.[1] || "image/png";
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }

      return new Blob([bytes], { type: mime });
    }

    function downloadBlob(blob, fileName) {
      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = objectUrl;
      link.download = fileName;
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      link.remove();

      window.setTimeout(() => {
        URL.revokeObjectURL(objectUrl);
      }, 1000);
    }

    function createPhotoFileName() {
      const stamp = new Date()
        .toISOString()
        .replaceAll(":", "")
        .replace(/\.\d{3}Z$/, "Z");
      return `riona-birthday-ar-photo-${stamp}.png`;
    }

    function ensureTransparentRenderer() {
      if (!sceneEl?.renderer) {
        return;
      }

      sceneEl.renderer.setClearColor(0x000000, 0);
      sceneEl.renderer.setClearAlpha(0);
    }

    function keepCameraFeedVisible() {
      ensureTransparentRenderer();
      keepCameraFeedVisibleOnce();

      window.setTimeout(keepCameraFeedVisibleOnce, 300);
      window.setTimeout(keepCameraFeedVisibleOnce, 1000);
    }

    function keepCameraFeedVisibleOnce() {
      ensureTransparentRenderer();

      for (const video of document.querySelectorAll("video")) {
        if (isArAssetVideo(video)) {
          continue;
        }

        video.style.position = "fixed";
        video.style.inset = "0";
        video.style.width = "100vw";
        video.style.height = "100vh";
        video.style.objectFit = "cover";
        video.style.background = "transparent";
        video.style.zIndex = "0";
      }
    }
  </script>
</body>
</html>
